[workspace]
resolver = "2"
members = ["crates/vaultair-core", "crates/vaultair-platform", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89" # File::try_lock (vault .lock file)
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tracing = "0.1.44"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
unwrap_used = "warn"
todo = "deny"

# Argon2 at real parameters (>= 64 MiB) and SQLCipher/OpenSSL are painfully slow
# unoptimized. Optimizing just these keeps debug builds and tests realistic.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.chacha20]
opt-level = 3
[profile.dev.package.poly1305]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.zxcvbn]
opt-level = 3
[profile.dev.package.libsqlite3-sys]
opt-level = 3
[profile.dev.package.openssl-sys]
opt-level = 3
[profile.dev.package.openssl-src]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "unwind"
strip = true
