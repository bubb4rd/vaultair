name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  detect:
    name: Detect workspace
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.d.outputs.rust }}
      web: ${{ steps.d.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - id: d
        run: |
          echo "rust=$([ -f Cargo.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "web=$([ -f package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  rust:
    name: Rust (fmt, clippy, test)
    runs-on: windows-latest
    # Skips cleanly until the Cargo workspace exists (Phase 1).
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # openssl-src (vendored by SQLCipher) needs a native Perl, not Git's MSYS Perl.
      - name: Put Strawberry Perl first on PATH
        shell: pwsh
        run: echo "C:\Strawberry\perl\bin" >> $env:GITHUB_PATH
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  supply-chain:
    name: Rust supply chain (cargo-deny, cargo-audit)
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  web:
    name: Frontend (lint, typecheck, test)
    runs-on: windows-latest
    needs: detect
    if: needs.detect.outputs.web == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run

  repo-hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No vault or backup files committed
        run: |
          found=$(git ls-files '*.vdb' '*.vhdr' '*.vhdr.*' '*.vaultair-backup')
          if [ -n "$found" ]; then echo "Vault files are tracked:"; echo "$found"; exit 1; fi
          echo "ok"
