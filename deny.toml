# cargo-deny policy. Checked in CI once the Cargo workspace exists.
# See docs/adr/0002-crypto-and-storage.md and the "no network" promise in docs/threat-model.md.

[graph]
targets = ["x86_64-pc-windows-msvc"]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Vulnerabilities always fail. "Unmaintained" only fails for crates we depend on directly:
# as of 2026-10-06 the transitive ones are `paste` (compile-time macro, via specta, which has
# no newer release) and `unic-*` (via tauri-utils 2.9 -> urlpattern 0.3). tauri-utils 2.10
# drops `unic-*` but needs Rust 1.90 and belongs to the next Tauri minor, so it waits for
# that upgrade. None of them has a known vulnerability.
# `cargo audit` reads the whole lockfile and also lists `glib` (unsound) and
# `proc-macro-error` (unmaintained). Both are GTK crates for Linux and are not in the
# Windows graph checked here (see [graph].targets).
unmaintained = "workspace"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "MPL-2.0",
    "OpenSSL",
    "BSL-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# The MVP makes no network connections. Adding any HTTP/socket client crate fails the build.
deny = [
    { name = "reqwest" },
    { name = "hyper" },
    { name = "ureq" },
    { name = "isahc" },
    { name = "curl" },
    { name = "surf" },
    { name = "attohttpc" },
    { name = "tokio-tungstenite" },
    { name = "tungstenite" },
    { name = "tauri-plugin-http" },
    { name = "tauri-plugin-updater" },
    { name = "tauri-plugin-shell" },
    { name = "tauri-plugin-fs" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[licenses.private]
# Our own crates are unpublished and proprietary.
ignore = true
