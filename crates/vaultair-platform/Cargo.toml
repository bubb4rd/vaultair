[package]
name = "vaultair-platform"
description = "OS integrations (clipboard, session events, capture protection). The only crate allowed `unsafe`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true
zeroize = "1.9.0"

[features]
# In-memory clipboard, session events, capture protection and Windows Hello for tests.
fake = []

# Must match the versions Tauri (wry) uses, so COM interface types are shared.
[target.'cfg(windows)'.dependencies]
webview2-com = "=0.38.2"
windows = { version = "=0.61.3", features = [
    # Windows Hello keys (quick unlock, ADR-0005).
    "Foundation",
    "Security_Credentials",
    "Security_Cryptography",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_TpmBaseServices",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
