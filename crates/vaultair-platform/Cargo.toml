[package]
name = "vaultair-platform"
description = "OS integrations (clipboard, session events, capture protection). The only crate allowed `unsafe`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true

# Must match the versions Tauri (wry) uses, so COM interface types are shared.
[target.'cfg(windows)'.dependencies]
webview2-com = "=0.38.2"
windows = { version = "=0.61.3", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }

[lints]
workspace = true
